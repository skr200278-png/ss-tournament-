<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProTournament BD | টুর্নামেন্ট ক্রিকেট, ফ্রি ফায়ার ও লুডু</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <script>
      // Gracefully prevent and suppress cross-origin / third-party iframe script errors or benign resize observer alerts
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.toLowerCase().includes('script error') || e.message.toLowerCase().includes('resizeobserver'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isDev = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' || 
                        window.location.hostname.includes('ais-dev-');

          if (!isDev) {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('ProTournament BD Service Worker registered successfully:', reg.scope))
              .catch(err => console.warn('Service Worker registration failed:', err));
          } else {
            console.log('Skipping Service Worker registration in development/preview mode');
            // Unregister any active service worker in development to prevent caching conflicts
            navigator.serviceWorker.getRegistrations().then(registrations => {
              for (let registration of registrations) {
                registration.unregister().then(success => {
                  if (success) console.log('Successfully unregistered stale development service worker');
                });
              }
            });
            // Clear browser cache storage to prevent loading of stale/broken assets in development
            if (window.caches) {
              caches.keys().then(keys => {
                keys.forEach(key => {
                  caches.delete(key).then(() => {
                    console.log('Cleared stale dev cache:', key);
                  });
                });
              });
            }
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
